<style>
:root{
  --bg:#F2F6F4; --surface:#FFFFFF; --ink:#0D2621; --muted:#4B625C; --line:#D5E1DC;
  --brand:#0B7A5C; --brand-ink:#FFFFFF; --accent:#F4B12E; --accent-ink:#2A1B00; --soft:#E3F0EA;
  --warn:#B93E0B; --ok:#0B7A5C;
  --c-food:#0B7A5C; --c-transport:#2F6FDE; --c-utilities:#D99A10; --c-rent:#B5533C;
  --c-family:#D9467A; --c-health:#0E9AA7; --c-shopping:#7C8B2A; --c-other:#6B7F79;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A1613; --surface:#12231F; --ink:#E8F2EE; --muted:#9DB3AB; --line:#24403A;
    --brand:#38C398; --brand-ink:#04231A; --soft:#163029; --warn:#FB923C; --ok:#38C398;
    --c-food:#38C398; --c-transport:#6B9BFF; --c-utilities:#F4B12E; --c-rent:#E58A72;
    --c-family:#F27AA3; --c-health:#4CC9D6; --c-shopping:#B6C74F; --c-other:#93A8A1;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1613; --surface:#12231F; --ink:#E8F2EE; --muted:#9DB3AB; --line:#24403A;
  --brand:#38C398; --brand-ink:#04231A; --soft:#163029; --warn:#FB923C; --ok:#38C398;
  --c-food:#38C398; --c-transport:#6B9BFF; --c-utilities:#F4B12E; --c-rent:#E58A72;
  --c-family:#F27AA3; --c-health:#4CC9D6; --c-shopping:#B6C74F; --c-other:#93A8A1;
}
*{box-sizing:border-box}
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 84px}
@media(min-width:721px){body{padding-block-end:0}}
h1,h2,h3{font-family:var(--f-display);line-height:1.08;text-wrap:balance;margin:0}
p{margin:0}
a{color:inherit}
.wrap{max-width:1120px;margin-inline:auto}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.3rem;text-decoration:none}
.mark{width:32px;height:32px;display:grid;place-items:center}
.top-actions{display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-weight:700;font-size:.85rem;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;text-decoration:none;background:var(--brand);color:var(--brand-ink);line-height:1.2}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:8px 14px;font-size:.9rem}
.nav-dl{display:none}
@media(min-width:721px){.nav-dl{display:inline-flex}}

/* hero */
.hero{display:grid;gap:32px;padding-block:36px 48px;align-items:center}
@media(min-width:900px){.hero{grid-template-columns:1.1fr .9fr;gap:56px;padding-block:56px 72px}}
.hero h1{font-size:clamp(2.3rem,6.4vw,4.1rem);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--accent) 62%,var(--accent) 92%,transparent 92%)}
.hero .sub{font-size:1.15rem;color:var(--muted);max-width:34em;margin-top:18px}
.stores{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.store{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:10px 18px;border-radius:12px;background:var(--brand);color:var(--brand-ink);text-decoration:none;min-width:190px}
.store small{font-size:.72rem;opacity:.85;letter-spacing:.02em}
.store b{font-size:1.05rem;font-family:var(--f-display)}
.store.soon{background:transparent;color:var(--muted);border:1.5px dashed var(--line);cursor:default}
.note{margin-top:14px;font-size:.92rem;color:var(--muted)}

/* phone demo */
.phone{background:var(--surface);border:1px solid var(--line);border-radius:32px;padding:18px 18px 16px;max-width:400px;width:100%;margin-inline:auto;box-shadow:0 20px 50px -25px rgba(9,40,32,.45)}
.ph-head{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted)}
.ph-head b{font-family:var(--f-display);color:var(--ink);font-size:.95rem}
.sample{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:.72rem}
.left{margin-top:12px}
.left .lbl{font-size:.8rem;color:var(--muted)}
.left .big{font-family:var(--f-display);font-weight:800;font-size:2.1rem;line-height:1.1}
.left .big.neg{color:var(--warn)}
.meter{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .5s}
.of{font-size:.8rem;color:var(--muted);margin-top:6px}
.cats{display:grid;gap:7px;margin-top:14px}
.cat{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;font-size:.82rem;padding:2px 4px;border-radius:8px}
.cat .bar{height:7px;border-radius:99px;background:var(--soft);overflow:hidden}
.cat .bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
.cat .v{color:var(--muted);text-align:right}
.cat.over .v{color:var(--warn);font-weight:700}
.cat.flash{animation:flash 1.1s}
@keyframes flash{0%{background:var(--accent)}100%{background:transparent}}
.entry{display:flex;gap:8px;margin-top:16px}
.entry input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.entry .btn{padding:12px 16px}
.mic{width:46px;padding:0;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center}
.mic.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:.8rem}
.chip:hover{background:var(--soft)}
.status{min-height:1.4em;font-size:.82rem;color:var(--muted);margin-top:8px}
.recent{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.recent h3{font-size:.8rem;color:var(--muted);font-family:var(--f-body);font-weight:500;margin-bottom:6px}
.tx{display:flex;justify-content:space-between;gap:8px;font-size:.86rem;padding:4px 0}
.tx span:first-child{display:flex;align-items:center;gap:8px;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.tx-new{animation:slide .4s}
@keyframes slide{from{opacity:.2;transform:translateY(-6px)}to{opacity:1;transform:none}}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.8rem;margin-top:8px;padding:0}

/* sections */
section{padding-block:56px}
.band{background:var(--surface);margin-inline:-16px;padding-inline:16px;border-block:1px solid var(--line)}
h2{font-size:clamp(1.7rem,4.4vw,2.6rem);font-weight:800;letter-spacing:-.015em}
.lede{color:var(--muted);margin-top:12px;max-width:40em}
.steps{display:grid;gap:16px;margin-top:28px}
@media(min-width:760px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{padding-top:14px;border-top:3px solid var(--brand)}
.step h3{font-size:1.25rem}
.step p{color:var(--muted);margin-top:6px}
.two{display:grid;gap:28px;margin-top:28px}
@media(min-width:860px){.two{grid-template-columns:1fr 1fr;gap:48px;align-items:start}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}
.band .panel{background:var(--bg)}
.row{display:grid;gap:6px;margin-bottom:16px}
.row label{display:flex;justify-content:space-between;gap:10px;font-weight:500;font-size:.95rem}
.row output{font-weight:700}
input[type=range]{width:100%;accent-color:var(--brand);height:28px}
.result{border-radius:16px;background:var(--brand);color:var(--brand-ink);padding:18px}
.result .k{font-size:.85rem;opacity:.9}
.result .n{font-family:var(--f-display);font-weight:800;font-size:2.2rem;line-height:1.1}
.res-grid{display:grid;gap:14px;margin-top:12px;grid-template-columns:1fr 1fr}
.res-grid .n{font-size:1.5rem}
.fine{font-size:.82rem;color:var(--muted);margin-top:12px}
.stack{position:relative;height:34px;border-radius:10px;background:var(--soft);overflow:hidden;display:flex;margin-top:6px}
.stack i{display:block;height:100%;transition:width .4s}
.stack .mk{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);transition:left .4s}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:.85rem;margin-top:10px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:700;font-size:.85rem}
.pill.ok{background:var(--soft);color:var(--ok)}
.pill.bad{background:var(--accent);color:var(--accent-ink)}
.bills{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:.92rem}
.bills li{display:flex;justify-content:space-between;gap:10px}
.soon-grid{display:grid;gap:14px;margin-top:26px}
@media(min-width:700px){.soon-grid{grid-template-columns:repeat(4,1fr)}}
.soon-item{border:1.5px dashed var(--line);border-radius:16px;padding:16px;background:var(--surface)}
.soon-item b{font-family:var(--f-display);font-size:1.05rem;display:block;margin-bottom:8px}
.tag{font-size:.75rem;font-weight:700;background:var(--soft);color:var(--brand);border-radius:99px;padding:2px 10px}
details{border-bottom:1px solid var(--line);padding-block:14px}
summary{font-weight:700;cursor:pointer;font-size:1.05rem;list-style-position:outside}
details p{color:var(--muted);margin-top:8px;max-width:42em}
.cta{text-align:left}
.cta h2{max-width:14em}
.share{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.linkbox{flex:1;min-width:180px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem}
footer{padding-block:28px;border-top:1px solid var(--line);font-size:.9rem;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between}
.sbar b{font-family:var(--f-display)}
.sbar .store{min-width:0;padding:8px 14px}
@media(min-width:721px){.sbar{display:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;font-size:.9rem}

/* previews */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:26px}
.tab{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:9px 16px;font-weight:700;font-size:.95rem}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.pv{margin-top:18px}
.pv-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.pv-head h3{font-size:1.5rem}
.tag.live{background:var(--brand);color:var(--brand-ink)}
.tag.soonx{background:var(--accent);color:var(--accent-ink)}
.pv-note{font-size:.85rem;color:var(--muted);margin-top:12px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label{font-weight:500;font-size:.95rem}
.field input[type=text],.field input[type=number]{padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;width:100%}
.token{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:.08em;word-spacing:.3em;background:var(--soft);border-radius:12px;padding:14px;margin-top:6px;overflow-wrap:anywhere}
.out{margin-top:14px;padding:16px;border-radius:16px;background:var(--soft)}
.out .k{font-size:.85rem;color:var(--muted)}
.out .n{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1.15}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.kv:last-child{border-bottom:0}
.ok-msg{color:var(--ok);font-weight:700}
.bad-msg{color:var(--warn);font-weight:700}
.scan{position:relative;width:100%;max-width:280px;aspect-ratio:1;margin-inline:auto;border-radius:20px;background:var(--ink);overflow:hidden;display:grid;place-items:center}
.scan canvas{width:66%;height:66%;image-rendering:pixelated;background:#fff;border-radius:6px;padding:6px}
.scan .line{position:absolute;left:8%;right:8%;height:3px;background:var(--accent);top:10%;animation:sweep 1.4s linear infinite;display:none}
.scan.on .line{display:block}
@keyframes sweep{0%{top:10%}50%{top:88%}100%{top:10%}}
.corner{position:absolute;width:26px;height:26px;border:3px solid var(--accent)}
.corner.a{top:12px;left:12px;border-right:0;border-bottom:0;border-top-left-radius:8px}
.corner.b{top:12px;right:12px;border-left:0;border-bottom:0;border-top-right-radius:8px}
.corner.c{bottom:12px;left:12px;border-right:0;border-top:0;border-bottom-left-radius:8px}
.corner.d{bottom:12px;right:12px;border-left:0;border-top:0;border-bottom-right-radius:8px}
.vcard{position:relative;width:100%;max-width:340px;aspect-ratio:1.586;border-radius:20px;padding:20px;color:#fff;background:linear-gradient(135deg,#0B7A5C 0%,#0E5A6B 100%);display:flex;flex-direction:column;justify-content:space-between;transition:filter .3s,opacity .3s}
.vcard.frozen{filter:grayscale(1) brightness(.7);opacity:.85}
.vcard .r1{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-weight:800}
.vcard .r1 small{font-family:var(--f-body);font-weight:500;background:rgba(255,255,255,.2);padding:2px 10px;border-radius:99px;letter-spacing:.04em}
.vcard .num16{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.1em}
.vcard .r3{display:flex;justify-content:space-between;font-size:.8rem;opacity:.95}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sw{position:relative;width:48px;height:28px;border-radius:99px;border:0;background:var(--line);padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--brand)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.wl{margin-top:34px;padding:20px;border-radius:20px;border:1.5px dashed var(--line);background:var(--surface)}
.wl form{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.wl input{flex:1;min-width:200px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.social{margin-top:28px}
.social b{font-family:var(--f-display);font-size:1.05rem;display:block;margin-bottom:10px}
.soc-row{display:flex;flex-wrap:wrap;gap:8px}
.soc-row a{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;font-size:.92rem;text-decoration:none;background:var(--surface)}
.soc-row a:hover{background:var(--soft)}
footer .soc-row a{padding:5px 12px;font-size:.85rem;background:transparent}
footer .foot-soc{margin-top:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <div class="wrap">

var NUM = {moja:1,mbili:2,tatu:3,nne:4,tano:5,sita:6,saba:7,nane:8,tisa:9,kumi:10};
function parseAmount(s){
  var m = s.match(/elfu\s+(moja|mbili|tatu|nne|tano|sita|saba|nane|tisa|kumi)/);
  if(m) return {n:NUM[m[1]]*1000,raw:m[0]};
  m = s.match(/elfu\s*(\d+)/);
  if(m) return {n:parseInt(m[1],10)*1000,raw:m[0]};
  m = s.match(/(\d{1,3}(?:,\d{3})+|\d+(?:\.\d+)?)\s*(k|k\b)?/);
  if(!m) return null;
  var n = parseFloat(m[1].replace(/,/g,""));
  if(m[2]) n*=1000;
  return {n:n,raw:m[0]};
}
function detectCat(s){
  var words = s.split(/[^a-z]+/);
  for(var k in KW){ for(var i=0;i<KW[k].length;i++){ if(words.indexOf(KW[k][i])>-1) return k; } }
  return "other";
}
function renderDemo(flashKey){

  cats.forEach(function(c){ totalL+=c.limit; totalS+=c.spent; });
  var left = totalL-totalS;
  var big=$("leftBig"); big.textContent = (left<0?"-":"")+tsh(Math.abs(left)); big.className="big num"+(left<0?" neg":"");
  $("meterFill").style.width = Math.min(100,totalS/totalL*100)+"%";
  $("ofTxt").textContent = t("of")+" "+tsh(totalL);
  var box=$("cats"); box.textContent="";
  cats.forEach(function(c){
    var pct = Math.min(100,c.spent/c.limit*100), over=c.spent>c.limit;
    var d=document.createElement("div"); d.className="cat"+(over?" over":"")+(flashKey===c.k?" flash":"");
    d.innerHTML='<span></span><div class="bar"><i></i></div><span class="v num"></span>';
    d.children[0].textContent=t("cat")[c.k];
    var i=d.querySelector("i"); i.style.width=pct+"%"; i.style.background=over?"var(--warn)":"var(--c-"+c.k+")";
    d.children[2].textContent=nf.format(Math.round(c.spent/1000))+"k / "+nf.format(c.limit/1000)+"k";
    box.appendChild(d);
  });
  var tb=$("txs"); tb.textContent="";
  txs.slice(0,4).forEach(function(x,idx){
    var r=document.createElement("div"); r.className="tx"+(idx===0&&flashKey?" tx-new":"");
    r.innerHTML='<span><i class="dot"></i><span></span></span><span class="num"></span>';
    r.querySelector(".dot").style.background="var(--c-"+x.k+")";
    r.querySelector("span span").textContent=x.l+" · "+t("cat")[x.k];
    r.lastChild.textContent="-"+tsh(x.a);
    tb.appendChild(r);
  });
}
function addEntry(raw){
  var s = raw.toLowerCase().trim();
  var a = parseAmount(s);
  if(!a || !(a.n>0)){ $("status").textContent=t("needAmt"); return; }
  var k = detectCat(s.replace(a.raw,""));
  var label = raw.trim().replace(new RegExp(a.raw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i"),"").replace(/\s+/g," ").trim();
  label = label ? label.charAt(0).toUpperCase()+label.slice(1) : t("cat")[k];
  var c = cats.filter(function(x){return x.k===k;})[0];
  c.spent += a.n;
  txs.unshift({l:label,k:k,a:a.n});
  var msg = t("added")+" "+tsh(a.n)+" "+t("to")+" "+t("cat")[k]+".";
  if(c.spent>c.limit) msg += " "+t("over")+" "+t("cat")[k]+".";
  $("status").textContent = msg;
  renderDemo(k);
  track("demo_add",{category:k});
}

/* QR */
function drawQr(){
  var c=$("qrc"), x=c.getContext("2d"), n=29, seed=7;
  function rnd(){ seed=(seed*16807)%2147483647; return seed/2147483647; }
  x.fillStyle="#fff"; x.fillRect(0,0,n,n); x.fillStyle="#0D2621";
  for(var i=0;i<n;i++) for(var j=0;j<n;j++) if(rnd()>0.52) x.fillRect(i,j,1,1);
  [[0,0],[n-7,0],[0,n-7]].forEach(function(p){
    x.fillStyle="#fff"; x.fillRect(p[0]-1,p[1]-1,9,9);
    x.fillStyle="#0D2621"; x.fillRect(p[0],p[1],7,7);
    x.fillStyle="#fff"; x.fillRect(p[0]+1,p[1]+1,5,5);
    x.fillStyle="#0D2621"; x.fillRect(p[0]+2,p[1]+2,3,3);
  });
}

applyLang();
track("page_view");
